services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: chitwan_care_template
      POSTGRES_USER: ${DB_USERNAME:-chitwan_template}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set a separate DB_PASSWORD for this template}
    ports:
      - "127.0.0.1:${DB_PORT:-54330}:5432"
    volumes:
      - chitwan_template_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d chitwan_care_template"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  chitwan_template_postgres:
