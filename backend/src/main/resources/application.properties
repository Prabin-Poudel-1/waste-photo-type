spring.application.name=chitwan-care
spring.config.import=optional:file:./auth-local.properties
app.auth.jwt-secret=${JWT_SECRET:}
app.storage.directory=${UPLOAD_DIR:./uploads}
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8082}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
server.error.include-message=never
server.error.include-stacktrace=never
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:54330/chitwan_care_template}
spring.datasource.username=${DB_USERNAME:chitwan_template}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=32
spring.flyway.enabled=true
spring.mvc.problemdetails.enabled=false
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5190,http://127.0.0.1:5190}
